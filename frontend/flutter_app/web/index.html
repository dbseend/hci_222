<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="TruePrice helps compare Cairo market quotes with recent reference prices.">
  <meta name="theme-color" content="#1B5E20">
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://maps.googleapis.com">
  <link rel="preconnect" href="https://maps.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://maps.googleapis.com">
  <link rel="dns-prefetch" href="https://maps.gstatic.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TruePrice">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TruePrice</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #F5F5F5;
    }

    body {
      overflow: hidden;
    }

    .app-loader {
      align-items: center;
      color: #1B5E20;
      display: flex;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 700;
      height: 100%;
      justify-content: center;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <div class="app-loader" aria-label="Loading TruePrice">TruePrice</div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="maps_config.js"></script>
  <script>
    (function () {
      function loadMapsScript() {
        var mapsKey = window.TRUEPRICE_GOOGLE_MAPS_WEB_API_KEY;
        if (!mapsKey) {
          return;
        }

        var mapsScript = document.createElement('script');
        mapsScript.src =
          'https://maps.googleapis.com/maps/api/js?key=' +
          encodeURIComponent(mapsKey);
        mapsScript.async = true;
        mapsScript.defer = true;
        document.head.appendChild(mapsScript);
      }

      function startFlutter() {
        var flutterScript = document.createElement('script');
        flutterScript.src = 'flutter_bootstrap.js';
        flutterScript.async = true;
        document.body.appendChild(flutterScript);
      }

      loadMapsScript();
      startFlutter();
    })();
  </script>
  <noscript>TruePrice requires JavaScript to run.</noscript>
</body>
</html>
